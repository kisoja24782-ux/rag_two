[project]
name = "rag-two"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kisoja24782-ux", email = "kisoja24782@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "faiss-cpu>=1.15.1",
    "grandalf>=0.8",
    "langchain-anthropic>=1.7.4",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-teddynote>=0.5.4",
    "langchain-text-splitters>=1.1.2",
    "matplotlib>=3.11.2",
    "mysql-connector-python>=26.7.0",
    "pymupdf>=1.28.2",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
rag-two = "rag_two:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
